# Optional: copy this file to .github/workflows/update-news.yml to refresh
# _data/news.yml every Monday from public eye-health news feeds.
name: Update eye health news

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python3 automation/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/news.yml
          git diff --cached --quiet || (git commit -m "Weekly eye health news update" && git push)
