---
layout: default
---
<article class="wrap article">
  <header class="art-head">
    <p class="eyebrow">{{ page.eyebrow | default: "YourEye.org" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
    {% if page.updated %}<p class="meta">Last updated {{ page.updated | date: "%B %-d, %Y" }}</p>{% endif %}
  </header>
  <div class="prose mt1">
    {{ content }}
  </div>
</article>
