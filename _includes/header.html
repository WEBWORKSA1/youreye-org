<header class="site-head">
  <div class="wrap head-row">
    <a class="brand" href="./" aria-label="YourEye.org home">{% include logo.svg %}<span>YourEye<b>.org</b></span></a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="tools/">Eye checks</a>
      <a href="conditions/">Conditions</a>
      <a href="guides/">Guides</a>
      <a href="videos.html">Videos</a>
      <a href="contests.html">Contests</a>
      <a href="support.html">Support us</a>
      <a class="btn btn-amber btn-sm nav-cta" href="find-care.html">Find eye care</a>
    </nav>
    <div class="head-tools">
      <a class="icon-btn" href="search.html" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></a>
      <button class="icon-btn" id="a11yBtn" type="button" aria-expanded="false" aria-controls="a11yPanel" aria-label="Display options">Aa</button>
      <button class="icon-btn burger" id="burger" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu"><span></span></button>
    </div>
  </div>
  <div class="a11y-panel" id="a11yPanel" hidden>
    <div class="wrap">
      <span>Text size</span>
      <button type="button" data-a11y="down" aria-label="Smaller text">A−</button>
      <button type="button" data-a11y="reset">Reset</button>
      <button type="button" data-a11y="up" aria-label="Larger text">A+</button>
      <button type="button" data-a11y="contrast">High contrast</button>
      <button type="button" data-a11y="motion">Reduce motion</button>
    </div>
  </div>
</header>
